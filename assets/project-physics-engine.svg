<svg xmlns="http://www.w3.org/2000/svg" width="580" height="300" viewBox="0 0 580 300" role="img" aria-labelledby="title desc">
  <title id="title">Cycling Physics Engine</title>
  <desc id="desc">Coming soon: a cycling performance simulation engine.</desc>
  <defs>
