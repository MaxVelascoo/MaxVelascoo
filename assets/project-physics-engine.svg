    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#ffad62" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffad62" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="578" height="298" rx="25" fill="url(#bg)" stroke="#efad72" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="1" y="1" width="578" height="298" rx="25" fill="url(#glow)"/>

  <g transform="translate(412 65)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-25" cy="14" r="30" stroke="#dba474" stroke-opacity="0.6" stroke-width="2"/>
